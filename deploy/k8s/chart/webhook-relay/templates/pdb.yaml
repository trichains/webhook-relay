{{- if .Values.podDisruptionBudget.enabled }}
# Voluntary disruptions (node drain, cluster upgrade) may never take the app below this many pods.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- with .Values.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "relay.webSelectorLabels" . | nindent 6 }}
{{- end }}
