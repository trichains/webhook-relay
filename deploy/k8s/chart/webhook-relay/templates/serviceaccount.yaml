{{- if .Values.serviceAccount.create }}
# The app never talks to the Kubernetes API: no token is mounted (automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "relay.serviceAccountName" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
