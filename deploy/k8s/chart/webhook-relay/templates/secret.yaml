{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.secretName" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  RELAY_ADMIN_TOKEN: {{ required "secrets.adminToken is required (or set secrets.existingSecret)" .Values.secrets.adminToken | quote }}
  CRON_SECRET: {{ required "secrets.cronSecret is required (or set secrets.existingSecret)" .Values.secrets.cronSecret | quote }}
{{- end }}
